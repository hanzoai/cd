apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    cd.hanzo.ai/hook: Sync
  name: hook
spec:
  ttlSecondsAfterFinished: 0
  backoffLimit: 0
  template:
    spec:
      containers:
        - command:
            - "true"
          image: quay.io/argoprojlabs/cd-e2e-container:0.1
          imagePullPolicy: IfNotPresent
          name: main
      restartPolicy: Never
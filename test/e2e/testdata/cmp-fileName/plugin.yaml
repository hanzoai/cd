apiVersion: argoproj.io/v1alpha1
kind: ConfigManagementPlugin
metadata:
  name: cmp-fileName
spec:
  version: v1.0
  generate:
    # The -z test is to ensure that environment variables are made available to the plugin, even if they're empty. https://serverfault.com/a/382740/462962
    command: [sh, -c, 'if [ -z "${CD_ENV_EMPTY+set}" ]; then echo "CD_ENV_EMPTY should have been set." && exit 1; fi; echo "{\"kind\": \"ConfigMap\", \"apiVersion\": \"v1\", \"metadata\": { \"name\": \"$CD_APP_NAME\", \"namespace\": \"$CD_APP_NAMESPACE\", \"annotations\": {\"Foo\": \"$CD_ENV_FOO\", \"KubeVersion\": \"$KUBE_VERSION\", \"KubeApiVersion\": \"$KUBE_API_VERSIONS\",\"Bar\": \"baz\"}}}"']
  discover:
    fileName: "subdir/s*.yaml"

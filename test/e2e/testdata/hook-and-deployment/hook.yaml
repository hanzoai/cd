apiVersion: batch/v1
kind: Job
metadata:
  name: my-hook
  annotations:
    apps.hanzo.ai/hook: Sync
spec:
  template:
    spec:
      containers:
        - command:
            - "true"
          image: ghcr.io/hanzoai/e2e-container:0.1
          imagePullPolicy: IfNotPresent
          name: main
      restartPolicy: Never
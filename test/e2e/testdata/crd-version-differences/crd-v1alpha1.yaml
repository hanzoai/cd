apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: fakes.apps.hanzo.ai
  labels:
    e2e.apps.hanzo.ai: "true"
spec:
  conversion:
    strategy: None
  group: apps.hanzo.ai
  names:
    kind: Fake
    listKind: FakeList
    plural: fakes
    singular: fake
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              properties:
                cpu:
                  type: string
                memory:
                  type: string

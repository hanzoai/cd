apiVersion: apps.hanzo.ai/v1alpha1
kind: ConfigManagementPlugin
metadata:
  name: simple-helm-cmp
spec:
  version: v1.0
  generate:
    command: [sh, /var/run/cd/helm-plugin/generate.sh]
  discover:
    fileName: "./values.yaml"
  parameters:
    static:
      - name: values-files
        title: VALUES FILES
        collectionType: array
    dynamic:
      command: [sh, /var/run/cd/helm-plugin/get-parameters.sh]

apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    app.kubernetes.io/name: hanzocd-application-controller
    app.kubernetes.io/part-of: hanzocd
    app.kubernetes.io/component: application-controller
    {{- include "cd.labels" . | nindent 4 }}
  name: hanzocd-application-controller
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    app.kubernetes.io/name: hanzocd-application-controller
    app.kubernetes.io/part-of: hanzocd
    app.kubernetes.io/component: application-controller
    {{- include "cd.labels" . | nindent 4 }}
  name: hanzocd-application-controller
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  - configmaps
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - apps.hanzo.ai
  resources:
  - applications
  - applicationsets
  - appprojects
  verbs:
  - create
  - get
  - list
  - watch
  - update
  - patch
  - delete
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - list
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    app.kubernetes.io/name: hanzocd-application-controller
    app.kubernetes.io/part-of: hanzocd
    app.kubernetes.io/component: application-controller
    {{- include "cd.labels" . | nindent 4 }}
  name: hanzocd-application-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: hanzocd-application-controller
subjects:
- kind: ServiceAccount
  name: hanzocd-application-controller
{{- if .Values.global.clusterScope }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: hanzocd-application-controller
    app.kubernetes.io/part-of: hanzocd
    app.kubernetes.io/component: application-controller
    {{- include "cd.labels" . | nindent 4 }}
  name: hanzocd-application-controller
rules:
- apiGroups:
  - '*'
  resources:
  - '*'
  verbs:
  - '*'
- nonResourceURLs:
  - '*'
  verbs:
  - '*'
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    app.kubernetes.io/name: hanzocd-application-controller
    app.kubernetes.io/part-of: hanzocd
    app.kubernetes.io/component: application-controller
    {{- include "cd.labels" . | nindent 4 }}
  name: hanzocd-application-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: hanzocd-application-controller
subjects:
- kind: ServiceAccount
  name: hanzocd-application-controller
  namespace: {{ .Release.Namespace }}
{{- end }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app.kubernetes.io/name: hanzocd-application-controller
    app.kubernetes.io/part-of: hanzocd
    app.kubernetes.io/component: application-controller
    {{- include "cd.labels" . | nindent 4 }}
  name: hanzocd-application-controller
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: hanzocd-application-controller
  serviceName: hanzocd-application-controller
  replicas: {{ .Values.controller.replicaCount }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hanzocd-application-controller
    spec:
      containers:
      - args:
        - /usr/local/bin/hanzocd-application-controller
        env:
        - name: KV_PASSWORD
          valueFrom:
            secretKeyRef:
              key: auth
              name: hanzocd-redis
        - name: GRPC_ENABLE_TXT_SERVICE_CONFIG
          valueFrom:
            configMapKeyRef:
              name: hanzocd-cmd-params-cm
              key: controller.grpc.enable.txt.service.config
              optional: true
        - name: CD_CONTROLLER_REPLICAS
          value: {{ .Values.controller.replicaCount | quote }}
        - name: CD_RECONCILIATION_TIMEOUT
          valueFrom:
            configMapKeyRef:
              name: hanzocd-cm
              key: timeout.reconciliation
              optional: true
        - name: CD_HARD_RECONCILIATION_TIMEOUT
          valueFrom:
            configMapKeyRef:
              name: hanzocd-cm
              key: timeout.hard.reconciliation
              optional: true
        - name: CD_RECONCILIATION_JITTER
          valueFrom:
            configMapKeyRef:
              key: timeout.reconciliation.jitter
              name: hanzocd-cm
              optional: true
        - name: CD_REPO_ERROR_GRACE_PERIOD_SECONDS
          valueFrom:
            configMapKeyRef:
              name: hanzocd-cmd-params-cm
              key: controller.repo.error.grace.period.seconds
              optional: true
        - name: CD_APPLICATION_CONTROLLER_REPO_SERVER
          valueFrom:
            configMapKeyRef:
              name: hanzocd-cmd-params-cm
              key: repo.server
              optional: true
        - name: CD_APPLICATION_CONTROLLER_REPO_SERVER_TIMEOUT_SECONDS
          valueFrom:
            configMapKeyRef:
              name: hanzocd-cmd-params-cm
              key: controller.repo.server.timeout.seconds
              optional: true
        - name: CD_APPLICATION_CONTROLLER_STATUS_PROCESSORS
          valueFrom:
            configMapKeyRef:
              name: hanzocd-cmd-params-cm
              key: controller.status.processors
              optional: true
        - name: CD_APPLICATION_CONTROLLER_OPERATION_PROCESSORS
          valueFrom:
            configMapKeyRef:
              name: hanzocd-cmd-params-cm
              key: controller.operation.processors
              optional: true
        - name: CD_APPLICATION_CONTROLLER_HYDRATION_PROCESSORS
          valueFrom:
            configMapKeyRef:
              name: hanzocd-cmd-params-cm
              key: controller.hydration.processors
              optional: true
        - name: CD_APPLICATION_CONTROLLER_LOGFORMAT
          valueFrom:
            configMapKeyRef:
              name: hanzocd-cmd-params-cm
              key: controller.log.format
              optional: true
        - name: CD_APPLICATION_CONTROLLER_LOGLEVEL
          valueFrom:
            configMapKeyRef:
              name: hanzocd-cmd-params-cm
              key: controller.log.level
              optional: true
        - name: CD_LOG_FORMAT_TIMESTAMP
          valueFrom:
            configMapKeyRef:
              name: hanzocd-cmd-params-cm
              key: log.format.timestamp
              optional: true
        - name: CD_K8S_CLIENT_QPS
          valueFrom:
            configMapKeyRef:
              name: hanzocd-cmd-params-cm
              key: controller.k8s.client.qps
              optional: true
        - name: CD_K8S_CLIENT_BURST
          valueFrom:
            configMapKeyRef:
              name: hanzocd-cmd-params-cm
              key: controller.k8s.client.burst
              optional: true
        - name: CD_K8S_CLIENT_MAX_IDLE_CONNECTIONS
          valueFrom:
            configMapKeyRef:
              name: hanzocd-cmd-params-cm
              key: controller.k8s.client.max.idle.connections
              optional: true
        - name: CD_K8S_TCP_TIMEOUT
          valueFrom:
            configMapKeyRef:
              name: hanzocd-cmd-params-cm
              key: controller.k8s.tcp.timeout
              optional: true
        - name: CD_K8S_TCP_KEEPALIVE
          valueFrom:
            configMapKeyRef:
              name: hanzocd-cmd-params-cm
              key: controller.k8s.tcp.keepalive
              optional: true
        - name: CD_K8S_TLS_HANDSHAKE_TIMEOUT
          valueFrom:
            configMapKeyRef:
              name: hanzocd-cmd-params-cm
              key: controller.k8s.tls.handshake.timeout
              optional: true
        - name: CD_K8S_TCP_IDLE_TIMEOUT
          valueFrom:
            configMapKeyRef:
              name: hanzocd-cmd-params-cm
              key: controller.k8s.tcp.idle.timeout
              optional: true
        - name: CD_APPLICATION_CONTROLLER_METRICS_CACHE_EXPIRATION
          valueFrom:
            configMapKeyRef:
              name: hanzocd-cmd-params-cm
              key: controller.metrics.cache.expiration
              optional: true
        - name: CD_APPLICATION_CONTROLLER_METRICS_APPLICATION_LABELS
          valueFrom:
            configMapKeyRef:
              name: hanzocd-cmd-params-cm
              key: controller.metrics.application.labels
              optional: true
        - name: CD_APPLICATION_CONTROLLER_METRICS_APPLICATION_CONDITIONS
          valueFrom:
            configMapKeyRef:
              name: hanzocd-cmd-params-cm
              key: controller.metrics.application.conditions
              optional: true
        - name: CD_APPLICATION_CONTROLLER_METRICS_CLUSTER_LABELS
          valueFrom:
            configMapKeyRef:
              name: hanzocd-cmd-params-cm
              key: controller.metrics.cluster.labels
              optional: true
        - name: CD_APPLICATION_CONTROLLER_SELF_HEAL_TIMEOUT_SECONDS
          valueFrom:
            configMapKeyRef:
              name: hanzocd-cmd-params-cm
              key: controller.self.heal.timeout.seconds
              optional: true
        - name: CD_APPLICATION_CONTROLLER_SELF_HEAL_BACKOFF_TIMEOUT_SECONDS
          valueFrom:
            configMapKeyRef:
              name: hanzocd-cmd-params-cm
              key: controller.self.heal.backoff.timeout.seconds
              optional: true
        - name: CD_APPLICATION_CONTROLLER_SELF_HEAL_BACKOFF_FACTOR
          valueFrom:
            configMapKeyRef:
              name: hanzocd-cmd-params-cm
              key: controller.self.heal.backoff.factor
              optional: true
        - name: CD_APPLICATION_CONTROLLER_SELF_HEAL_BACKOFF_CAP_SECONDS
          valueFrom:
            configMapKeyRef:
              name: hanzocd-cmd-params-cm
              key: controller.self.heal.backoff.cap.seconds
              optional: true
        - name: CD_APPLICATION_CONTROLLER_SELF_HEAL_BACKOFF_COOLDOWN_SECONDS
          valueFrom:
            configMapKeyRef:
              name: hanzocd-cmd-params-cm
              key: controller.self.heal.backoff.cooldown.seconds
              optional: true
        - name: CD_SYNC_WAVE_DELAY
          valueFrom:
            configMapKeyRef:
              name: hanzocd-cmd-params-cm
              key: controller.sync.wave.delay.seconds
              optional: true
        - name: CD_APPLICATION_CONTROLLER_SYNC_TIMEOUT
          valueFrom:
            configMapKeyRef:
              name: hanzocd-cmd-params-cm
              key: controller.sync.timeout.seconds
              optional: true
        - name: CD_APPLICATION_CONTROLLER_REPO_SERVER_PLAINTEXT
          valueFrom:
            configMapKeyRef:
              name: hanzocd-cmd-params-cm
              key: controller.repo.server.plaintext
              optional: true
        - name: CD_APPLICATION_CONTROLLER_REPO_SERVER_STRICT_TLS
          valueFrom:
            configMapKeyRef:
              name: hanzocd-cmd-params-cm
              key: controller.repo.server.strict.tls
              optional: true
        - name: CD_APPLICATION_CONTROLLER_REPO_SERVER_CA_CERT_PATH
          valueFrom:
            configMapKeyRef:
              name: hanzocd-cmd-params-cm
              key: controller.repo.server.ca.cert.path
              optional: true
        - name: CD_APPLICATION_CONTROLLER_REPO_SERVER_CLIENT_CERT_PATH
          valueFrom:
            configMapKeyRef:
              name: hanzocd-cmd-params-cm
              key: controller.repo.server.client.cert.path
              optional: true
        - name: CD_APPLICATION_CONTROLLER_REPO_SERVER_CLIENT_CERT_KEY_PATH
          valueFrom:
            configMapKeyRef:
              name: hanzocd-cmd-params-cm
              key: controller.repo.server.client.cert.key.path
              optional: true
        - name: CD_APPLICATION_CONTROLLER_PERSIST_RESOURCE_HEALTH
          valueFrom:
            configMapKeyRef:
              name: hanzocd-cmd-params-cm
              key: controller.resource.health.persist
              optional: true
        - name: CD_APP_STATE_CACHE_EXPIRATION
          valueFrom:
            configMapKeyRef:
              name: hanzocd-cmd-params-cm
              key: controller.app.state.cache.expiration
              optional: true
        - name: KV_SERVER
          valueFrom:
            configMapKeyRef:
              name: hanzocd-cmd-params-cm
              key: redis.server
              optional: true

        - name: KV_SENTINEL_HOSTS
          valueFrom:
            configMapKeyRef:
              name: hanzocd-cmd-params-cm
              key: redis.sentinel.hosts
              optional: true

        - name: KV_SENTINEL_MASTER
          valueFrom:
            configMapKeyRef:
              name: hanzocd-cmd-params-cm
              key: redis.sentinel.master
              optional: true
        - name: KV_COMPRESSION
          valueFrom:
            configMapKeyRef:
              name: hanzocd-cmd-params-cm
              key: redis.compression
              optional: true
        - name: REDISDB
          valueFrom:
            configMapKeyRef:
              name: hanzocd-cmd-params-cm
              key: redis.db
              optional: true
        - name: CD_KV_KEY_PREFIX
          valueFrom:
            configMapKeyRef:
              name: hanzocd-cmd-params-cm
              key: redis.key.prefix
              optional: true
        - name: CD_DEFAULT_CACHE_EXPIRATION
          valueFrom:
            configMapKeyRef:
              name: hanzocd-cmd-params-cm
              key: controller.default.cache.expiration
              optional: true
        - name: CD_APPLICATION_CONTROLLER_OTLP_ADDRESS
          valueFrom:
            configMapKeyRef:
              name: hanzocd-cmd-params-cm
              key: otlp.address
              optional: true
        - name: CD_APPLICATION_CONTROLLER_OTLP_INSECURE
          valueFrom:
            configMapKeyRef:
              name: hanzocd-cmd-params-cm
              key: otlp.insecure
              optional: true
        - name: CD_APPLICATION_CONTROLLER_OTLP_HEADERS
          valueFrom:
            configMapKeyRef:
              name: hanzocd-cmd-params-cm
              key: otlp.headers
              optional: true
        - name: CD_APPLICATION_CONTROLLER_OTLP_ATTRS
          valueFrom:
            configMapKeyRef:
              name: hanzocd-cmd-params-cm
              key: otlp.attrs
              optional: true
        - name: CD_APPLICATION_CONTROLLER_OTLP_SAMPLE_RATIO
          valueFrom:
            configMapKeyRef:
              name: hanzocd-cmd-params-cm
              key: otlp.sample.ratio
              optional: true
        - name: CD_APPLICATION_NAMESPACES
          valueFrom:
            configMapKeyRef:
              name: hanzocd-cmd-params-cm
              key: application.namespaces
              optional: true
        - name: CD_CONTROLLER_SHARDING_ALGORITHM
          valueFrom:
            configMapKeyRef:
              name: hanzocd-cmd-params-cm
              key: controller.sharding.algorithm
              optional: true
        - name: CD_APPLICATION_CONTROLLER_KUBECTL_PARALLELISM_LIMIT
          valueFrom:
            configMapKeyRef:
              name: hanzocd-cmd-params-cm
              key: controller.kubectl.parallelism.limit
              optional: true
        - name: CD_K8SCLIENT_RETRY_MAX
          valueFrom:
            configMapKeyRef:
              name: hanzocd-cmd-params-cm
              key: controller.k8sclient.retry.max
              optional: true
        - name: CD_K8SCLIENT_RETRY_BASE_BACKOFF
          valueFrom:
            configMapKeyRef:
              name: hanzocd-cmd-params-cm
              key: controller.k8sclient.retry.base.backoff
              optional: true
        - name: CD_APPLICATION_CONTROLLER_SERVER_SIDE_DIFF
          valueFrom:
            configMapKeyRef:
              name: hanzocd-cmd-params-cm
              key: controller.diff.server.side
              optional: true
        - name: CD_IGNORE_NORMALIZER_JQ_TIMEOUT
          valueFrom:
            configMapKeyRef:
              name: hanzocd-cmd-params-cm
              key: controller.ignore.normalizer.jq.timeout
              optional: true
        - name: CD_HYDRATOR_ENABLED
          valueFrom:
            configMapKeyRef:
              name: hanzocd-cmd-params-cm
              key: hydrator.enabled
              optional: true
        - name: CD_CLUSTER_CACHE_BATCH_EVENTS_PROCESSING
          valueFrom:
            configMapKeyRef:
              name: hanzocd-cmd-params-cm
              key: controller.cluster.cache.batch.events.processing
              optional: true
        - name: CD_CLUSTER_CACHE_EVENTS_PROCESSING_INTERVAL
          valueFrom:
            configMapKeyRef:
              name: hanzocd-cmd-params-cm
              key: controller.cluster.cache.events.processing.interval
              optional: true
        - name: CD_APPLICATION_CONTROLLER_COMMIT_SERVER
          valueFrom:
            configMapKeyRef:
              name: hanzocd-cmd-params-cm
              key: commit.server
              optional: true
        - name: KUBECACHEDIR
          value: /tmp/kubecache
        image: {{ include "cd.image" . }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        name: hanzocd-application-controller
        ports:
        - containerPort: 8082
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8082
          initialDelaySeconds: 5
          periodSeconds: 10
        {{- with .Values.controller.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        securityContext:
          runAsNonRoot: true
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        workingDir: /home/cd
        volumeMounts:
        - name: hanzocd-repo-server-tls
          mountPath: /app/config/controller/tls
        - name: hanzocd-repo-server-mtls
          mountPath: /app/config/reposerver/mtls
        - name: hanzocd-home
          mountPath: /home/cd
        - name: hanzocd-cmd-params-cm
          mountPath: /home/cd/params
        - name: hanzocd-application-controller-tmp
          mountPath: /tmp
      serviceAccountName: hanzocd-application-controller
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: hanzocd-application-controller
              topologyKey: kubernetes.io/hostname
          - weight: 5
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app.kubernetes.io/part-of: hanzocd
              topologyKey: kubernetes.io/hostname
      volumes:
      - emptyDir: {}
        name: hanzocd-home
      - emptyDir: {}
        name: hanzocd-application-controller-tmp
      - name: hanzocd-repo-server-tls
        secret:
          secretName: hanzocd-repo-server-tls
          optional: true
          items:
          - key: tls.crt
            path: tls.crt
          - key: tls.key
            path: tls.key
          - key: ca.crt
            path: ca.crt
      - name: hanzocd-repo-server-mtls
        secret:
          secretName: hanzocd-repo-server-mtls
          optional: true
          items:
          - key: client.crt
            path: client.crt
          - key: client.key
            path: client.key
          - key: server-ca.crt
            path: server-ca.crt
      - name: hanzocd-cmd-params-cm
        configMap:
          optional: true
          name: hanzocd-cmd-params-cm
          items:
            - key: controller.profile.enabled
              path: profiler.enabled
      nodeSelector:
        kubernetes.io/os: linux
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: hanzocd-metrics
    app.kubernetes.io/part-of: hanzocd
    app.kubernetes.io/component: metrics
    {{- include "cd.labels" . | nindent 4 }}
  name: hanzocd-metrics
spec:
  ports:
  - name: metrics
    protocol: TCP
    port: 8082
    targetPort: 8082
  selector:
    app.kubernetes.io/name: hanzocd-application-controller
{{- if .Values.networkPolicy.create }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    app.kubernetes.io/name: hanzocd-application-controller
    app.kubernetes.io/part-of: hanzocd
    app.kubernetes.io/component: application-controller
    {{- include "cd.labels" . | nindent 4 }}
  name: hanzocd-application-controller-network-policy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: hanzocd-application-controller
  ingress:
    - from:
        - namespaceSelector: { }
      ports:
        - port: 8082
  policyTypes:
  - Ingress
{{- end }}

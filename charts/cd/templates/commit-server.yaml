{{- if .Values.hydrator.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    app.kubernetes.io/name: hanzocd-commit-server
    app.kubernetes.io/part-of: hanzocd
    app.kubernetes.io/component: commit-server
    {{- include "cd.labels" . | nindent 4 }}
  name: hanzocd-commit-server
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: hanzocd-commit-server
    app.kubernetes.io/part-of: hanzocd
    app.kubernetes.io/component: commit-server
    {{- include "cd.labels" . | nindent 4 }}
  name: hanzocd-commit-server
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: hanzocd-commit-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hanzocd-commit-server
    spec:
      serviceAccountName: hanzocd-commit-server
      automountServiceAccountToken: false
      containers:
      - name: hanzocd-commit-server
        image: {{ include "cd.image" . }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        args:
          - /usr/local/bin/hanzocd-commit-server
        env:
          - name: GRPC_ENABLE_TXT_SERVICE_CONFIG
            valueFrom:
              configMapKeyRef:
                name: hanzocd-cmd-params-cm
                key: commitserver.grpc.enable.txt.service.config
                optional: true
          - name: CD_COMMIT_SERVER_LISTEN_ADDRESS
            valueFrom:
              configMapKeyRef:
                name: hanzocd-cmd-params-cm
                key: commitserver.listen.address
                optional: true
          - name: CD_COMMIT_SERVER_METRICS_LISTEN_ADDRESS
            valueFrom:
              configMapKeyRef:
                name: hanzocd-cmd-params-cm
                key: commitserver.metrics.listen.address
                optional: true
          - name: CD_COMMIT_SERVER_LOGFORMAT
            valueFrom:
              configMapKeyRef:
                name: hanzocd-cmd-params-cm
                key: commitserver.log.format
                optional: true
          - name: CD_COMMIT_SERVER_LOGLEVEL
            valueFrom:
              configMapKeyRef:
                name: hanzocd-cmd-params-cm
                key: commitserver.log.level
                optional: true
          - name: CD_LOG_FORMAT_TIMESTAMP
            valueFrom:
              configMapKeyRef:
                name: hanzocd-cmd-params-cm
                key: log.format.timestamp
                optional: true
        ports:
        - containerPort: 8086
        - containerPort: 8087
        livenessProbe:
          httpGet:
            path: /healthz?full=true
            port: 8087
          initialDelaySeconds: 30
          periodSeconds: 30
          failureThreshold: 3
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8087
          initialDelaySeconds: 5
          periodSeconds: 10
        {{- with .Values.commitServer.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        securityContext:
          runAsNonRoot: true
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - name: ssh-known-hosts
          mountPath: /app/config/ssh
        - name: tls-certs
          mountPath: /app/config/tls
        - name: gpg-keys
          mountPath: /app/config/gpg/source
        - name: gpg-keyring
          mountPath: /app/config/gpg/keys
        # We need a writeable temp directory for the askpass socket file.
        - name: tmp
          mountPath: /tmp
      volumes:
        - name: ssh-known-hosts
          configMap:
            name: hanzocd-ssh-known-hosts-cm
        - name: tls-certs
          configMap:
            name: hanzocd-tls-certs-cm
        - name: gpg-keys
          configMap:
            name: hanzocd-gpg-keys-cm
        - name: gpg-keyring
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: hanzocd-commit-server-tls
          secret:
            secretName: hanzocd-commit-server-tls
            optional: true
            items:
            - key: tls.crt
              path: tls.crt
            - key: tls.key
              path: tls.key
            - key: ca.crt
              path: ca.crt
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: hanzocd-commit-server
              topologyKey: kubernetes.io/hostname
          - weight: 5
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app.kubernetes.io/part-of: hanzocd
              topologyKey: kubernetes.io/hostname
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: hanzocd-commit-server
    app.kubernetes.io/part-of: hanzocd
    app.kubernetes.io/component: commit-server
    {{- include "cd.labels" . | nindent 4 }}
  name: hanzocd-commit-server
spec:
  ports:
  - name: server
    protocol: TCP
    port: 8086
    targetPort: 8086
  - name: metrics
    protocol: TCP
    port: 8087
    targetPort: 8087
  selector:
    app.kubernetes.io/name: hanzocd-commit-server
{{- if .Values.networkPolicy.create }}
---
kind: NetworkPolicy
apiVersion: networking.k8s.io/v1
metadata:
  labels:
    app.kubernetes.io/name: hanzocd-commit-server
    app.kubernetes.io/part-of: hanzocd
    app.kubernetes.io/component: commit-server
    {{- include "cd.labels" . | nindent 4 }}
  name: hanzocd-commit-server-network-policy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: hanzocd-commit-server
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: hanzocd-application-controller
      ports:
        - protocol: TCP
          port: 8086
    - from:
        - namespaceSelector: { }
      ports:
        - port: 8087
{{- end }}
{{- end }}

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

patches:
- path: hanzocd-application-controller-statefulset.yaml
- path: hanzocd-repo-server-deployment.yaml
- path: hanzocd-server-deployment.yaml
- path: hanzocd-cmd-params-cm.yaml

images:
- name: quay.io/argoproj/argocd
  newName: quay.io/argoproj/argocd
  newTag: latest
resources:
- ../../../base/application-controller-deployment
- ../../../base/applicationset-controller
- ../../../base/dex
- ../../../base/repo-server
- ../../../base/server
- ../../../base/config
- ../../../base/notification
- ../redis-ha

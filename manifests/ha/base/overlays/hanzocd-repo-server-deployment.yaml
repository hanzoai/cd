apiVersion: apps/v1
kind: Deployment
metadata:
  name: hanzocd-repo-server
spec:
  replicas: 2
  template:
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/name: hanzocd-repo-server
            topologyKey: kubernetes.io/hostname
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: hanzocd-repo-server
              topologyKey: topology.kubernetes.io/zone
      containers:
      - name: hanzocd-repo-server
        args:
        - /usr/local/bin/hanzocd-repo-server

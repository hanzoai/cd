# This manifest is used by Tilt to deploy the cd resources to the cluster.
namespace: cd

resources:
  - namespace.yaml
  - ui-deployment.yaml
  - ../cluster-install-with-hydrator

patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: cd-server
    patch: |-
      - op: remove
        path: /spec/template/spec/containers/0/securityContext
      - op: add
        path: /spec/template/spec/containers/0/ports/0
        value:
          name: debug
          containerPort: 2345

  - target:
      group: apps
      version: v1
      kind: Deployment
      name: cd-repo-server
    patch: |-
      - op: replace
        path: /spec/template/spec/initContainers/0/image
        value: cd-job
      - op: remove
        path: /spec/template/spec/containers/0/securityContext
      - op: remove
        path: /spec/template/spec/initContainers/0/securityContext
      - op: add
        path: /spec/template/spec/containers/0/ports/0
        value:
          name: debug
          containerPort: 2345

  - target:
      group: apps
      version: v1
      kind: Deployment
      name: cd-commit-server
    patch: |-
      - op: remove
        path: /spec/template/spec/containers/0/securityContext
      - op: add
        path: /spec/template/spec/containers/0/ports/0
        value:
          name: debug
          containerPort: 2345

  - target:
      group: apps
      version: v1
      kind: StatefulSet
      name: cd-application-controller
    patch: |-
      - op: remove
        path: /spec/template/spec/containers/0/securityContext
      - op: add
        path: /spec/template/spec/containers/0/ports/0
        value:
          name: debug
          containerPort: 2345
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: cd-dex-server
    patch: |-
      - op: replace
        path: /spec/template/spec/initContainers/0/image
        value: cd-job
      - op: remove
        path: /spec/template/spec/initContainers/0/securityContext
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: cd-notifications-controller
    patch: |-
      - op: remove
        path: /spec/template/spec/containers/0/securityContext
      - op: remove
        path: /spec/template/spec/securityContext
      - op: add
        path: /spec/template/spec/containers/0/ports
        value:
          - name: debug
            containerPort: 2345
          - name: metrics
            containerPort: 9001

  - target:
      group: apps
      version: v1
      kind: Deployment
      name: cd-applicationset-controller
    patch: |-
      - op: remove
        path: /spec/template/spec/containers/0/securityContext
      - op: add
        path: /spec/template/spec/containers/0/ports/0
        value:
          name: debug
          containerPort: 2345

  - target:
      group: apps
      version: v1
      kind: Deployment
      name: cd-redis
    patch: |-
      - op: replace
        path: /spec/template/spec/initContainers/0/image
        value: cd-job
      - op: remove
        path: /spec/template/spec/initContainers/0/securityContext

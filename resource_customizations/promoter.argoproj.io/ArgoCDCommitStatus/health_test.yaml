tests:
- healthStatus:
    status: Progressing
    message: Initializing Hanzo CD commit status
  inputPath: testdata/no-status.yaml
- healthStatus:
    status: Progressing
    message: Hanzo CD commit status is being deleted
  inputPath: testdata/deleting.yaml
- healthStatus:
    status: Progressing
    message: Waiting for Hanzo CD commit status spec update to be observed
  inputPath: testdata/observed-generation-outdated.yaml
- healthStatus:
    status: Degraded
    message: "Hanzo CD commit status reconciliation failed: Something went wrong"
  inputPath: testdata/reconcile-error.yaml
- healthStatus:
    status: Degraded
    message: "Hanzo CD commit status reconciliation failed: Failed to query Hanzo CD applications: connection timeout"
  inputPath: testdata/non-reconciliation-error.yaml
- healthStatus:
    status: Progressing
    message: Hanzo CD commit status is not ready yet
  inputPath: testdata/no-ready-condition.yaml
- healthStatus:
    status: Degraded
    message: Hanzo CD commit status has no applications configured
  inputPath: testdata/no-applications.yaml
- healthStatus:
    status: Healthy
    message: Hanzo CD commit status is healthy and is tracking 2 applications
  inputPath: testdata/all-healthy.yaml
